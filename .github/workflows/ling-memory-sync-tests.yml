name: Ling memory sync checks
on:
  pull_request:
    paths:
      - 'memory-sync/**'
      - '.github/workflows/ling-memory-sync-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        working-directory: memory-sync
        run: |
          node --check src/index.mjs
          node --check src/core.mjs
          node --check src/providers.mjs
      - name: Test without cloud credentials
        working-directory: memory-sync
        run: npm test
